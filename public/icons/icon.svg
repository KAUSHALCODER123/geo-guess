<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="#0b0f19"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="url(#flagBg)" opacity="0.12"/>
  <circle cx="256" cy="256" r="180" stroke="url(#flagBg)" stroke-width="6" opacity="0.4" stroke-dasharray="8 8"/>
  
  <!-- Flag pole & Banner -->
  <g filter="url(#shadow)">
    <!-- Flagpole -->
    <path d="M168 128 V384" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="168" cy="120" r="14" fill="url(#goldAcc)"/>
    
    <!-- Flowing Flag Banner -->
    <path d="M175 140 C220 120 260 160 305 140 C350 120 375 130 385 135 L385 275 C375 270 350 260 305 280 C260 300 220 260 175 280 Z" fill="url(#flagBg)"/>
    
    <!-- Globe Meridian Lines inside flag -->
    <path d="M230 155 C255 190 255 230 230 265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M320 155 C345 190 345 230 320 265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="278" cy="208" r="28" fill="url(#goldAcc)"/>
    <!-- Compass Star in center -->
    <polygon points="278,188 284,204 300,208 284,212 278,228 272,212 256,208 272,204" fill="#0b0f19"/>
  </g>
</svg>
